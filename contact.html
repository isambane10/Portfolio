
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Njabulo Khoza | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Njabulo Khoza
                <span>Aspiring Software Developer</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="content-section contact-section">

            <div class="section-heading">
                <span class="eyebrow">LET'S CONNECT</span>
                <h1>Get In Touch</h1>

                <p>
                    Thank you for visiting my portfolio.
                    Feel free to use the form below to get in touch.
                </p>
            </div>

            <div class="contact-card">

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Write your message here..."
                            required></textarea>
                    </div>

                    <button type="submit" class="button">
                        Send Message
                    </button>

                    <p class="form-notice">
                        This is a demonstration form. Messages are not sent.
                    </p>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Njabulo Khoza. All rights reserved.</p>
    </footer>

</body>
</html>
